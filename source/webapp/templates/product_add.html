{% extends 'base.html' %}

{% block title %}Add Product{% endblock %}

{% block content %}
<h1>Add Product</h1>

<div class="col-md-6">
    {% if errors %}
    {% for error in errors %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endfor %}
    {% endif %}

    <form action="{% url 'product_add' %}" method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label for="name" class="form-label">Title</label>
            <input id="name" name="name" class="form-control" type="text" value="{{ name }}"
                      required>
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <input id="price" name="price" class="form-control" type="number" step="0.01" min="0" value="{{ price }}"
                      required>
        </div>

        <div class="mb-3">
            <label for="image" class="form-label">Image url</label>
            <input id="image" name="image" class="form-control" type="url" value="{{ image }}"
                      required>
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <select id="category" name="category" class="form-select" required>
                <option value="">-- Choose category --</option>
                {% for c in categories %}
                <option value="{{ c.pk }}" {% if c.pk|stringformat:"s" == category %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" name="description" class="form-control"
                      rows="4">{{ description }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary">Add product</button>
    </form>
</div>
{% endblock %}
