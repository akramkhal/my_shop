{% extends 'base.html' %}

{% block title %}Products{% endblock %}

{% block content %}
{% if products %}
    <div class="row row-cols-1 row-cols-lg-2 g-4">
        {% for product in products %}
        <div class="col">
            <div class="card h-100">
              <div class="row g-0">
                <div class="col-md-4">
                  <img src="{{ product.image }}" class="product-img rounded-start" alt="{{ product.name }}">
                </div>
                <div class="col-md-8">
                  <div class="card-body">
                    <h5 class="card-title">{{ product.name }}</h5>
                    <p class="card-text text-muted">{{ product.category }}</p>
                      <p class="card-text fw-bold">Price: {{ product.price }}</p>
                      <a href="{% url 'product_view' product.pk %}">see more >>></a>
                  </div>
                </div>
              </div>
            </div>
        </div>
        {% endfor %}
    </div>
{% else %}
<div class="alert alert-info">No products yet!</div>
{% endif %}
{% endblock %}
