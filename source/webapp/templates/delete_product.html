{% extends 'base.html' %}

{% block title %}Delete Product{% endblock %}

{% block content %}
<h2>Are you sure you want to delete "{{ product.name }}"?</h2>
    <div >
    <form method="POST" class="d-flex gap-2">
    {% csrf_token %}
        <button type="submit" class="btn btn-danger mt-2">Yes</button>
        <a href="{% url 'product_view' product.pk %}" class="btn btn-secondary mt-2">No</a>
    </form>
    </div>
{% endblock %}
